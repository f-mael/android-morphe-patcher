name: Patch Brave Browser

'on':
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      brave_variant:
        description: 'Variante de Brave Browser'
        required: true
        type: choice
        options:
          - all
          - Stable
          - Beta
          - Nightly
        default: 'all'
      architecture:
        description: 'Arquitectura de destino'
        required: true
        type: choice
        options:
          - all
          - armv8
          - armv7
          - universal
        default: 'all'
      theme:
        description: 'Tema visual (Estándar o AMOLED puro)'
        required: true
        type: choice
        options:
          - all
          - standard
          - amoled
        default: 'all'
      apk_url:
        description: 'URL directa opcional al APK de Brave (deja vacío para auto-detectar de releases)'
        required: false
        type: string
        default: ''

concurrency:
  group: brave-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check Updates & Resolve Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_title: ${{ steps.resolve.outputs.release_title }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      patches_version: ${{ steps.resolve.outputs.patches_version }}
      brave_stable_version: ${{ steps.resolve.outputs.brave_stable_version }}
      brave_beta_version: ${{ steps.resolve.outputs.brave_beta_version }}
      brave_nightly_version: ${{ steps.resolve.outputs.brave_nightly_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve matrix and versions
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VARIANT: ${{ inputs.brave_variant }}
          INPUT_ARCH: ${{ inputs.architecture }}
          INPUT_THEME: ${{ inputs.theme }}
          INPUT_APK_URL: ${{ inputs.apk_url }}
        run: bash scripts/resolve-matrix.sh

  prepare:
    name: Prepare Tools & Patches
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Download Morphe CLI and dh6k patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/setup-tools.sh "${{ needs.check.outputs.patches_version }}" "tools"

      - name: Upload Tools Artifact
        uses: actions/upload-artifact@v7
        with:
          name: morphe-tools
          path: tools/
          retention-days: 1
          if-no-files-found: error

  patch:
    name: Patch Brave (${{ matrix.brave_variant }} - ${{ matrix.architecture }})
    needs: [check, prepare]
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Download Tools Artifact
        uses: actions/download-artifact@v4
        with:
          name: morphe-tools
          path: tools

      - name: Build and Sign Patched APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          chmod +x tools/cli.jar
          bash scripts/build-apk.sh \
            "${{ matrix.brave_variant }}" \
            "${{ matrix.architecture }}" \
            "${{ matrix.brave_tag }}" \
            "${{ matrix.theme_mode }}" \
            "${{ matrix.apk_url }}"

      - name: Upload APKs and Metadata
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ matrix.brave_variant }}-${{ matrix.architecture }}
          path: |
            *.apk
            *.sha256
            metadata-*.json
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish Unified Release
    needs: [check, patch]
    if: |
      !cancelled() &&
      needs.check.outputs.should_run == 'true' &&
      (needs.patch.result == 'success' || needs.patch.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout scripts and assets
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: apks-*
          merge-multiple: true

      - name: Publish Unified Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish-release.sh \
            "release-assets" \
            "${{ needs.check.outputs.release_tag }}" \
            "${{ needs.check.outputs.release_title }}" \
            "${{ needs.check.outputs.patches_version }}" \
            "${{ needs.check.outputs.prerelease }}" \
            "${{ needs.patch.result }}"
