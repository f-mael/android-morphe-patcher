name: Patch Brave Browser

on:
  workflow_dispatch:
    inputs:
      brave_variant:
        description: 'Variante de Brave Browser'
        required: true
        type: choice
        options:
          - Stable
          - Beta
          - Nightly
        default: 'Stable'
      architecture:
        description: 'Arquitectura de destino'
        required: true
        type: choice
        options:
          - armv8
          - armv7
          - universal
        default: 'armv8'
      apk_url:
        description: 'URL directa opcional al APK de Brave (deja vacío para auto-detectar de releases)'
        required: false
        type: string
        default: ''

jobs:
  patch:
    name: Patch Brave APK (${{ inputs.brave_variant }} - ${{ inputs.architecture }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup tools and patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/setup-tools.sh
          bash scripts/setup-tools.sh "dh6k/morphe-patches"

      - name: Resolve and download Brave APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAVE_VARIANT: ${{ inputs.brave_variant }}
          ARCH: ${{ inputs.architecture }}
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -e

          if [ -n "$APK_URL" ]; then
            echo "=========================================================="
            echo "==> Descargando APK desde URL directa provista:"
            echo "    $APK_URL"
            echo "=========================================================="
            curl -fL -o input.apk "$APK_URL"
          else
            echo "=========================================================="
            echo "==> Resolviendo release oficial de brave/brave-browser..."
            echo "=========================================================="

            case "$BRAVE_VARIANT" in
              "Stable")
                PREFIX="Release "
                ;;
              "Beta")
                PREFIX="Beta "
                ;;
              "Nightly")
                PREFIX="Nightly "
                ;;
              *)
                echo "Error: Variante no reconocida '$BRAVE_VARIANT'" >&2
                exit 1
                ;;
            esac

            echo "Buscando release con prefijo '$PREFIX' y paquetes APK disponibles..."

            # Consultar los últimos releases y filtrar el primero que coincida con la variante y contenga APKs
            RELEASE_TAG=$(gh api "repos/brave/brave-browser/releases?per_page=30" | jq -r --arg prefix "$PREFIX" '
              map(select((.name | startswith($prefix)) and (.assets | any(.name | endswith(".apk"))))) | first | .tag_name
            ')

            if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "null" ]; then
              echo "Error: No se encontró una release válida con APKs para la variante '$BRAVE_VARIANT'" >&2
              exit 1
            fi

            echo "Release seleccionada: $RELEASE_TAG"

            # Identificar el activo APK correspondiente a la arquitectura seleccionada
            # armv8     -> arm64 / Bravearm64Universal.apk / arm64.apk
            # armv7     -> monoarm / [0-9]-arm.apk / arm.apk (excluyendo arm64)
            # universal -> universal.apk / Bravearm64Universal.apk
            ASSET_NAME=$(gh api "repos/brave/brave-browser/releases/tags/$RELEASE_TAG" | jq -r --arg arch "$ARCH" '
              .assets | map(select(.name | endswith(".apk"))) as $apks |
              (
                if $arch == "armv8" then
                  ($apks | map(select(.name | test("arm64.*universal|arm64"; "i"))) | first | .name)
                elif $arch == "armv7" then
                  ($apks | map(select((.name | test("monoarm|[0-9]-arm|arm"; "i")) and (.name | test("arm64"; "i") | not))) | first | .name)
                elif $arch == "universal" then
                  ($apks | map(select(.name | test("universal"; "i"))) | first | .name)
                else
                  empty
                end
              ) // ($apks | first | .name)
            ')

            if [ -z "$ASSET_NAME" ] || [ "$ASSET_NAME" = "null" ]; then
              echo "Error: No se pudo resolver el nombre del activo para la arquitectura '$ARCH'" >&2
              exit 1
            fi

            echo "Descargando activo '$ASSET_NAME' desde la release '$RELEASE_TAG'..."
            gh release download "$RELEASE_TAG" --repo brave/brave-browser --pattern "$ASSET_NAME" --output input.apk
          fi

          echo "=========================================================="
          echo "==> APK de entrada obtenido con éxito:"
          ls -lh input.apk
          echo "=========================================================="

      - name: Patch APK with Morphe CLI
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          chmod +x scripts/patch-runner.sh
          OUTPUT_APK="brave-${{ inputs.brave_variant }}-${{ inputs.architecture }}-patched.apk"
          bash scripts/patch-runner.sh input.apk "$OUTPUT_APK"

      - name: Upload patched APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brave-patched-${{ inputs.brave_variant }}-${{ inputs.architecture }}
          path: brave-*-patched.apk
          retention-days: 7
          if-no-files-found: error
