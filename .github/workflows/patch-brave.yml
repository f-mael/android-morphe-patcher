name: Patch Brave Browser

'on':
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      brave_variant:
        description: 'Variante de Brave Browser'
        required: true
        type: choice
        options:
          - Stable
          - Beta
          - Nightly
        default: 'Stable'
      architecture:
        description: 'Arquitectura de destino'
        required: true
        type: choice
        options:
          - armv8
          - armv7
          - universal
        default: 'armv8'
      apk_url:
        description: 'URL directa opcional al APK de Brave (deja vacío para auto-detectar de releases)'
        required: false
        type: string
        default: ''
      wallpaper_resolution:
        description: 'Resolución de wallpapers (ANCHOxALTO, ej: 1220x2712 o 1080x1920)'
        required: false
        default: '1220x2712'
        type: string

permissions:
  contents: write
  packages: read

jobs:
  check:
    name: Check Updates & Resolve Matrix
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check updates and resolve build matrix
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VARIANT: ${{ inputs.brave_variant }}
          INPUT_ARCH: ${{ inputs.architecture }}
          INPUT_APK_URL: ${{ inputs.apk_url }}
        run: |
          set -e

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "==> Ejecución manual (workflow_dispatch) detectada."
            echo "==> Compilando variante elegida: $INPUT_VARIANT ($INPUT_ARCH)"

            MATRIX_JSON=$(jq -cn \
              --arg variant "$INPUT_VARIANT" \
              --arg arch "$INPUT_ARCH" \
              --arg url "$INPUT_APK_URL" \
              '{"include": [{"brave_variant": $variant, "architecture": $arch, "apk_url": $url}]}')

            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "==> Ejecución programada (schedule / cron) detectada."
          echo "==> Verificando actualizaciones en Brave Browser y dh6k/morphe-patches..."

          # 1. Obtener tag de última versión de parches dh6k
          LATEST_PATCHES_TAG=$(gh api "repos/dh6k/morphe-patches/releases/latest" --jq .tag_name 2>/dev/null || echo "")
          echo "Último tag de dh6k/morphe-patches: '$LATEST_PATCHES_TAG'"

          # 2. Obtener tag de última release estable oficial de Brave con APKs
          LATEST_BRAVE_TAG=$(gh api "repos/brave/brave-browser/releases?per_page=30" | jq -r '
            map(select((.name | startswith("Release ")) and (.assets | any(.name | endswith(".apk"))))) | first | .tag_name
          ' 2>/dev/null || echo "")
          echo "Último tag estable de Brave Browser: '$LATEST_BRAVE_TAG'"

          # 3. Obtener releases previas de este repositorio
          EXISTING_TAGS=$(gh release list --limit 30 --json tagName --jq '.[].tagName' 2>/dev/null || echo "")

          SAFE_BRAVE_TAG=$(echo "$LATEST_BRAVE_TAG" | tr -d ' ' | tr '/' '-')
          SAFE_PATCHES_TAG=$(echo "$LATEST_PATCHES_TAG" | tr -d ' ' | tr '/' '-')

          echo "Verificando si ya existen releases para Brave ($SAFE_BRAVE_TAG) y parches ($SAFE_PATCHES_TAG)..."

          if [ -n "$SAFE_BRAVE_TAG" ] && [ -n "$SAFE_PATCHES_TAG" ] && \
             echo "$EXISTING_TAGS" | grep -q "$SAFE_BRAVE_TAG" && \
             echo "$EXISTING_TAGS" | grep -q "$SAFE_PATCHES_TAG"; then
            echo "=========================================================="
            echo "==> No hay cambios ni actualizaciones de Brave ni de los parches."
            echo "==> Cancelando ejecución limpiamente sin gastar minutos de Action."
            echo "=========================================================="
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[{\"brave_variant\":\"none\",\"architecture\":\"none\",\"apk_url\":\"\"}]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "==> Nuevas actualizaciones detectadas o compilación pendiente. Generando matriz completa..."
          MATRIX_JSON=$(jq -cn '{
            "include": [
              {"brave_variant": "Stable", "architecture": "armv8", "apk_url": ""},
              {"brave_variant": "Stable", "architecture": "armv7", "apk_url": ""},
              {"brave_variant": "Stable", "architecture": "universal", "apk_url": ""},
              {"brave_variant": "Beta", "architecture": "armv8", "apk_url": ""},
              {"brave_variant": "Beta", "architecture": "armv7", "apk_url": ""},
              {"brave_variant": "Beta", "architecture": "universal", "apk_url": ""},
              {"brave_variant": "Nightly", "architecture": "armv8", "apk_url": ""},
              {"brave_variant": "Nightly", "architecture": "armv7", "apk_url": ""},
              {"brave_variant": "Nightly", "architecture": "universal", "apk_url": ""}
            ]
          }')

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  patch:
    name: Patch & Release Brave (${{ matrix.brave_variant }} - ${{ matrix.architecture }})
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Process and Normalize Wallpapers
        env:
          WALLPAPER_RES: ${{ inputs.wallpaper_resolution }}
        run: |
          set -e
          echo "=========================================================="
          echo "==> Procesando y normalizando fondos de pantalla..."
          echo "=========================================================="

          # 1. Instalar o verificar ImageMagick
          if command -v magick >/dev/null 2>&1; then
            IM_CMD="magick"
          elif command -v convert >/dev/null 2>&1; then
            IM_CMD="convert"
          else
            echo "ImageMagick no encontrado. Instalando..."
            sudo apt-get update -y && sudo apt-get install -y imagemagick
            if command -v magick >/dev/null 2>&1; then
              IM_CMD="magick"
            else
              IM_CMD="convert"
            fi
          fi
          echo "Utilizando binario de ImageMagick: $IM_CMD"

          # 2. Asegurar existencia del directorio wallpapers/
          WALLPAPERS_DIR="wallpapers"
          mkdir -p "$WALLPAPERS_DIR"

          # Si no hay ninguna imagen, crear fondos de muestra por defecto
          if [ -z "$(find "$WALLPAPERS_DIR" -maxdepth 1 -type f 2>/dev/null)" ]; then
            echo "==> Directorio $WALLPAPERS_DIR/ vacío. Generando imágenes de muestra..."
            python3 -c "
          import os, struct, zlib
          os.makedirs('wallpapers', exist_ok=True)
          def make_png(filename, r, g, b, w=1220, h=2712):
              row = b'\x00' + bytes([r, g, b]) * w
              data = zlib.compress(row * h)
              with open(filename, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
                  f.write(struct.pack('>I', len(ihdr)) + b'IHDR' + ihdr + struct.pack('>I', zlib.crc32(b'IHDR' + ihdr)))
                  f.write(struct.pack('>I', len(data)) + b'IDAT' + data + struct.pack('>I', zlib.crc32(b'IDAT' + data)))
                  f.write(struct.pack('>I', 0) + b'IEND' + struct.pack('>I', zlib.crc32(b'IEND')))
          make_png('wallpapers/wallpaper_1.png', 24, 27, 32)
          make_png('wallpapers/wallpaper_2.png', 30, 27, 75)
          make_png('wallpapers/wallpaper_3.png', 15, 41, 47)
          "
          fi

          echo "Resolución configurada: '${WALLPAPER_RES:-original}'"

          # 3. Iterar sobre todos los archivos dentro de wallpapers/
          shopt -s nullglob
          for img in "$WALLPAPERS_DIR"/*; do
            [ -f "$img" ] || continue

            filename=$(basename "$img")
            base_no_ext="${filename%.*}"
            target_png="$WALLPAPERS_DIR/${base_no_ext}.png"
            tmp_png="$WALLPAPERS_DIR/.tmp_${base_no_ext}.png"

            echo "--> Procesando: $img"
            if [ -n "$WALLPAPER_RES" ]; then
              echo "    Recortando y redimensionando proporcionalmente a $WALLPAPER_RES..."
              $IM_CMD "$img" -resize "${WALLPAPER_RES}^" -gravity center -extent "$WALLPAPER_RES" "$tmp_png"
            else
              echo "    Manteniendo dimensiones originales y convirtiendo a PNG estricto..."
              $IM_CMD "$img" "$tmp_png"
            fi

            # Si el archivo original no era el PNG destino, eliminarlo
            if [ "$img" != "$target_png" ]; then
              rm -f "$img"
            fi
            mv -f "$tmp_png" "$target_png"
          done
          shopt -u nullglob

          # 4. Eliminar cualquier archivo que no sea PNG para garantizar compatibilidad estricta
          find "$WALLPAPERS_DIR" -maxdepth 1 -type f ! -name "*.png" -delete

          echo "=========================================================="
          echo "==> Fondos de pantalla normalizados exitosamente:"
          ls -lh "$WALLPAPERS_DIR"/*.png
          if command -v identify >/dev/null 2>&1; then
            identify "$WALLPAPERS_DIR"/*.png || true
          fi
          echo "=========================================================="

      - name: Download Morphe CLI and Resolve Patches
        id: tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -e
          mkdir -p tools

          echo "=========================================================="
          echo "==> 1. Descargando Morphe CLI..."
          echo "=========================================================="
          gh release download --repo MorpheApp/morphe-cli --pattern "*all.jar" --dir tools 2>/dev/null || \
          gh release download --repo MorpheApp/morphe-desktop --pattern "*all.jar" --dir tools
          mv tools/*all.jar tools/cli.jar
          chmod +x tools/cli.jar

          echo "=========================================================="
          echo "==> 2. Resolviendo bundle de parches..."
          echo "=========================================================="
          if [ -f "tools/patches.jar" ]; then
            echo "Usando tools/patches.jar preexistente..."
            echo "patches_version=custom-patches" >> "$GITHUB_OUTPUT"
          elif [ -d "src-patches" ]; then
            echo "Compilando bundle de parches con rotación múltiple desde src-patches..."
            (
              cd src-patches
              chmod +x gradlew
              ./gradlew build -x test --no-daemon
            )
            BUILT_PATCH=$(find src-patches/patches/build/libs -maxdepth 1 -type f \( -name "*.mpp" -o -name "*.jar" \) 2>/dev/null | head -n 1)
            if [ -n "$BUILT_PATCH" ] && [ -f "$BUILT_PATCH" ]; then
              cp "$BUILT_PATCH" tools/patches.jar
              echo "Bundle de parches compilado exitosamente: $BUILT_PATCH -> tools/patches.jar"
              echo "patches_version=multi-wallpaper-dev" >> "$GITHUB_OUTPUT"
            else
              echo "Error: No se encontró artefacto compilado en src-patches/patches/build/libs/" >&2
              exit 1
            fi
          else
            PATCHES_TAG=$(gh release view --repo dh6k/morphe-patches --json tagName --jq .tagName 2>/dev/null || echo "latest")
            echo "patches_version=$PATCHES_TAG" >> "$GITHUB_OUTPUT"

            if gh release download --repo dh6k/morphe-patches --pattern "*.jar" --dir tools 2>/dev/null; then
              mv tools/*.jar tools/patches.jar
            elif gh release download --repo dh6k/morphe-patches --pattern "*.mpp" --dir tools 2>/dev/null; then
              mv tools/*.mpp tools/patches.jar
            else
              echo "Error: No se pudo obtener el bundle de parches de dh6k/morphe-patches" >&2
              exit 1
            fi
          fi

          echo "=========================================================="
          echo "==> 3. Verificando/descargando integrations APK..."
          echo "=========================================================="
          if [ -f "tools/integrations.apk" ]; then
            echo "tools/integrations.apk ya existe."
          elif [ -d "src-patches/extensions" ] && find src-patches/extensions -name "*.apk" | grep -q .; then
            EXT_APK=$(find src-patches/extensions -name "*.apk" | head -n 1)
            cp "$EXT_APK" tools/integrations.apk
            echo "Integrations APK copiado desde src-patches: $EXT_APK"
          elif gh release download --repo dh6k/morphe-patches --pattern "*.apk" --dir tools 2>/dev/null; then
            mv tools/*.apk tools/integrations.apk
            echo "Integrations APK descargado desde dh6k/morphe-patches."
          elif gh release download --repo MorpheApp/morphe-patches --pattern "*.apk" --dir tools 2>/dev/null; then
            mv tools/*.apk tools/integrations.apk
            echo "Integrations APK descargado desde fallback MorpheApp/morphe-patches."
          else
            echo "Nota: Integraciones incluidas dentro del bundle de parches."
          fi

          ls -lh tools/


      - name: Resolve and download Brave APK
        id: brave
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAVE_VARIANT: ${{ matrix.brave_variant }}
          ARCH: ${{ matrix.architecture }}
          APK_URL: ${{ matrix.apk_url }}
        run: |
          set -e

          if [ -n "$APK_URL" ]; then
            echo "=========================================================="
            echo "==> Descargando APK desde URL directa provista:"
            echo "    $APK_URL"
            echo "=========================================================="
            curl -fL -o input.apk "$APK_URL"
            BRAVE_TAG="manual-url"
          else
            echo "=========================================================="
            echo "==> Resolviendo release oficial de brave/brave-browser..."
            echo "=========================================================="

            case "$BRAVE_VARIANT" in
              "Stable")
                PREFIX="Release "
                ;;
              "Beta")
                PREFIX="Beta "
                ;;
              "Nightly")
                PREFIX="Nightly "
                ;;
              *)
                echo "Error: Variante desconocida '$BRAVE_VARIANT'" >&2
                exit 1
                ;;
            esac

            echo "Buscando release con prefijo '$PREFIX' y paquetes APK..."
            RELEASE_TAG=$(gh api "repos/brave/brave-browser/releases?per_page=30" | jq -r --arg prefix "$PREFIX" '
              map(select((.name | startswith($prefix)) and (.assets | any(.name | endswith(".apk"))))) | first | .tag_name
            ')

            if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" = "null" ]; then
              echo "Error: No se encontró release con APKs para la variante '$BRAVE_VARIANT'" >&2
              exit 1
            fi

            echo "Release seleccionada: $RELEASE_TAG"
            BRAVE_TAG="$RELEASE_TAG"

            # Identificar el activo APK para la arquitectura
            ASSET_NAME=$(gh api "repos/brave/brave-browser/releases/tags/$RELEASE_TAG" | jq -r --arg arch "$ARCH" '
              .assets | map(select(.name | endswith(".apk"))) as $apks |
              (
                if $arch == "armv8" then
                  ($apks | map(select(.name | test("arm64.*universal|arm64"; "i"))) | first | .name)
                elif $arch == "armv7" then
                  ($apks | map(select((.name | test("monoarm|[0-9]-arm|arm"; "i")) and (.name | test("arm64"; "i") | not))) | first | .name)
                elif $arch == "universal" then
                  ($apks | map(select(.name | test("universal"; "i"))) | first | .name)
                else
                  empty
                end
              ) // ($apks | first | .name)
            ')

            if [ -z "$ASSET_NAME" ] || [ "$ASSET_NAME" = "null" ]; then
              echo "Error: No se pudo resolver el nombre del activo para '$ARCH'" >&2
              exit 1
            fi

            echo "Descargando '$ASSET_NAME' de la release '$RELEASE_TAG'..."
            gh release download "$RELEASE_TAG" --repo brave/brave-browser --pattern "$ASSET_NAME" --output input.apk
          fi

          echo "brave_version=$BRAVE_TAG" >> "$GITHUB_OUTPUT"
          ls -lh input.apk

      - name: Inspect compatible patches
        run: |
          set -e
          echo "=========================================================="
          echo "==> Inspeccionando parches compatibles para com.brave.browser..."
          echo "=========================================================="
          java -jar tools/cli.jar list-patches --patches tools/patches.jar --filter-package com.brave.browser 2>/dev/null || \
          java -jar tools/cli.jar list-patches --patches tools/patches.jar --filter-package-name com.brave.browser -x || \
          java -jar tools/cli.jar list-patches --patches tools/patches.jar -f com.brave.browser || true

      - name: Patch and Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
          BRAVE_VARIANT: ${{ matrix.brave_variant }}
          ARCH: ${{ matrix.architecture }}
        run: |
          set -e
          OUTPUT_APK="brave-${BRAVE_VARIANT}-${ARCH}-patched.apk"
          KEYSTORE_ARGS=()

          # Configurar keystore si está presente en los secretos
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "==> Configurando keystore personalizado desde secretos..."
            mkdir -p certs
            echo "$KEYSTORE_BASE64" | base64 -d > certs/signing.keystore
            KEYSTORE_ARGS=(
              --keystore certs/signing.keystore
              --keystore-password "${KEYSTORE_PASSWORD:-}"
              --keystore-entry-alias "${KEYSTORE_ALIAS:-}"
              --keystore-entry-password "${KEYSTORE_ENTRY_PASSWORD:-${KEYSTORE_PASSWORD:-}}"
            )
          else
            echo "==> No se detectó KEYSTORE_BASE64. Morphe CLI usará el keystore de depuración por defecto."
          fi

          # Evaluar compatibilidad de --merge
          MERGE_ARGS=()
          if [ -f "tools/integrations.apk" ]; then
            if java -jar tools/cli.jar patch --help 2>&1 | grep -q -- "--merge"; then
              echo "CLI soporta opción --merge; adjuntando tools/integrations.apk..."
              MERGE_ARGS=("--merge" "tools/integrations.apk")
            else
              echo "tools/integrations.apk disponible pero Morphe CLI empaqueta las integraciones internamente; omitiendo --merge."
            fi
          fi

          # Verificar existencia de imágenes en carpeta wallpapers/
          WALLPAPERS_DIR="wallpapers"
          echo "=========================================================="
          echo "==> Fondos de pantalla preparados para el parcheo:"
          ls -lh "$WALLPAPERS_DIR"/*.png
          echo "=========================================================="

          echo "=========================================================="
          echo "==> Ejecutando parcheo con Morphe CLI..."
          echo "=========================================================="
          java -jar tools/cli.jar patch \
            --patches tools/patches.jar \
            -e "Custom NTP wallpaper" \
            -O customWallpaper=wallpapers/ \
            -e "Mock Brave Origin Premium" \
            -e "Brave Origin" \
            -e "Brave Startup Performance Optimization" \
            ${MERGE_ARGS[@]+"${MERGE_ARGS[@]}"} \
            ${KEYSTORE_ARGS[@]+"${KEYSTORE_ARGS[@]}"} \
            -o "$OUTPUT_APK" \
            input.apk

          rm -rf certs

          echo "=========================================================="
          echo "==> APK parcheado exitosamente:"
          ls -lh "$OUTPUT_APK"
          echo "=========================================================="

      - name: Generate Release Notes and Metadata
        id: release_meta
        env:
          BRAVE_VARIANT: ${{ matrix.brave_variant }}
          ARCH: ${{ matrix.architecture }}
          BRAVE_VERSION: ${{ steps.brave.outputs.brave_version }}
          PATCHES_VERSION: ${{ steps.tools.outputs.patches_version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          WALLPAPER_RES: ${{ inputs.wallpaper_resolution }}
        run: |
          set -e
          OUTPUT_APK="brave-${BRAVE_VARIANT}-${ARCH}-patched.apk"
          SHA256_HASH=$(sha256sum "$OUTPUT_APK" | awk '{print $1}')
          BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          SAFE_BRAVE_TAG=$(echo "$BRAVE_VERSION" | tr -d ' ' | tr '/' '-')
          SAFE_PATCHES_TAG=$(echo "$PATCHES_VERSION" | tr -d ' ' | tr '/' '-')
          TAG_NAME="brave-${BRAVE_VARIANT}-${ARCH}-${SAFE_BRAVE_TAG}-${SAFE_PATCHES_TAG}-TEST-MULTI-WP"

          if [ -n "$KEYSTORE_BASE64" ]; then
            SIGNING_STATUS="Firmado con keystore personalizado (persistente)"
          else
            SIGNING_STATUS="Firmado con keystore de depuración (Morphe CLI predeterminado)"
          fi

          {
            echo "# Brave Browser (${BRAVE_VARIANT} - ${ARCH}) - TEST-MULTI-WP"
            echo ""
            echo "Compilación de prueba automatizada de Brave Browser con soporte de múltiples fondos de pantalla (Custom NTP Multi-Wallpaper) y rotación aleatoria en tiempo de ejecución."
            echo ""
            echo "## Información de la compilación"
            echo ""
            echo "| Parámetro | Valor |"
            echo "| :--- | :--- |"
            echo "| **Versión base de Brave** | \`${BRAVE_VERSION}\` |"
            echo "| **Versión de parches** | \`${PATCHES_VERSION}\` |"
            echo "| **Arquitectura** | \`${ARCH}\` |"
            echo "| **Estado de firma** | ${SIGNING_STATUS} |"
            echo "| **Fecha de compilación** | \`${BUILD_DATE}\` |"
            echo "| **Tag de Release** | \`${TAG_NAME}\` |"
            if [ -n "$WALLPAPER_RES" ]; then
              echo "| **Resolución de wallpapers** | \`${WALLPAPER_RES}\` |"
            fi
            echo ""
            echo "## Parches aplicados"
            echo ""
            echo "- **Custom NTP wallpaper (Multi-Wallpaper & Random Rotation)**: Soporte dinámico para múltiples fondos inyectados por lotes con rotación aleatoria en tiempo de ejecución."
            echo "- **Brave Origin**: Desbloqueo de opciones de Brave Origin y limpieza de telemetría/componentes innecesarios."
            echo "- **Brave Startup Performance Optimization**: Optimización de arranque eliminando latencia de inicialización OEM."
            echo ""
            echo "## Integridad del binario (SHA-256)"
            echo ""
            echo '```text'
            echo "${SHA256_HASH}  ${OUTPUT_APK}"
            echo '```'
          } > release_notes.md


          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "output_apk=$OUTPUT_APK" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
          OUTPUT_APK: ${{ steps.release_meta.outputs.output_apk }}
          BRAVE_VARIANT: ${{ matrix.brave_variant }}
          ARCH: ${{ matrix.architecture }}
          BRAVE_VERSION: ${{ steps.brave.outputs.brave_version }}
        run: |
          set -e
          RELEASE_TITLE="Brave ${BRAVE_VARIANT} (${ARCH}) - ${BRAVE_VERSION} - TEST-MULTI-WP"
          PRERELEASE_FLAG="--prerelease"


          echo "=========================================================="
          echo "==> Publicando en GitHub Releases con tag: $TAG_NAME"
          echo "=========================================================="

          # Si el tag o release ya existía previamente, actualizar y sobreescribir binarios con --clobber
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "La release '$TAG_NAME' ya existe en el repositorio. Actualizando con --clobber..."
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file release_notes.md $PRERELEASE_FLAG || true
            gh release upload "$TAG_NAME" "$OUTPUT_APK" --clobber
          else
            echo "Creando nueva release para tag '$TAG_NAME'..."
            gh release create "$TAG_NAME" "$OUTPUT_APK" \
              --title "$RELEASE_TITLE" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG 2>/dev/null || \
            (
              echo "Aviso: El tag ya existía previamente. Actualizando y subiendo binario con --clobber..."
              gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes-file release_notes.md $PRERELEASE_FLAG || true
              gh release upload "$TAG_NAME" "$OUTPUT_APK" --clobber
            )
          fi

          echo "=========================================================="
          echo "==> Publicación completada exitosamente."
          echo "=========================================================="
